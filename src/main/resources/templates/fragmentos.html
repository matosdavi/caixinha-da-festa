<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="cabeca(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#1f6f5c">
    <title th:text="${titulo}">Caixinha da Festa</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
    <script th:src="@{/js/painel.js}" defer></script>
</head>
<body>
<header th:fragment="topo(ativo)" class="topo">
    <a class="marca" th:href="@{/painel}">🎉 Caixinha</a>
    <nav class="menu" aria-label="Painel">
        <a th:href="@{/painel}" th:attr="aria-current=${ativo == 'inicio'} ? 'page' : null">Início</a>
        <a th:href="@{/painel/pessoas}" th:attr="aria-current=${ativo == 'pessoas'} ? 'page' : null">Pessoas</a>
        <a th:href="@{/painel/lancamentos}" th:attr="aria-current=${ativo == 'lancamentos'} ? 'page' : null">Lançamentos</a>
        <a th:href="@{/painel/orcamento}" th:attr="aria-current=${ativo == 'orcamento'} ? 'page' : null">Orçamento</a>
        <a th:href="@{/painel/configuracoes}" th:attr="aria-current=${ativo == 'configuracoes'} ? 'page' : null">Configurações</a>
    </nav>
    <form th:action="@{/sair}" method="post">
        <button type="submit" class="botao-link">Sair</button>
    </form>
</header>

<div th:fragment="avisos">
    <p class="aviso" th:if="${sucesso}" th:text="${sucesso}" role="status"></p>
    <p class="aviso erro" th:if="${erro}" th:text="${erro}" role="alert"></p>
</div>
</body>
</html>
