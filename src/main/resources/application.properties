spring.application.name=caixinha-da-festa

# Lê o arquivo .env da pasta do projeto, se existir (em produção as variáveis
# vêm do ambiente do Render). Copie o .env.example para .env para começar.
spring.config.import=optional:file:.env[.properties]

# Login do organizador (único usuário). Sem senha (só fora de produção),
# uma senha temporária aparece no console.
app.admin.usuario=${ADMIN_USUARIO:organizador}
app.admin.senha=${ADMIN_SENHA:}

# Porta (o Render define a variável PORT)
server.port=${PORT:8080}
# O Render recebe o HTTPS e repassa como HTTP: usa os cabeçalhos X-Forwarded-*
# para saber que o acesso original foi https (cookie seguro, redirecionamentos).
server.forward-headers-strategy=framework
server.servlet.session.cookie.same-site=lax

# Banco: vem do DATABASE_URL (veja config/ConfiguracaoDoAmbiente.java).
# Sem DATABASE_URL, usa um arquivo H2 local em ./data (modo compatível com PostgreSQL).
# O schema é criado SÓ pelo Flyway (src/main/resources/db/migration);
# o Hibernate apenas confere se as entidades batem com as tabelas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.flyway.locations=classpath:db/migration

# Pool pequeno e que solta conexões ociosas: o Neon "dorme" quando ninguém usa,
# e isso economiza as horas de computação do plano grátis.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000

spring.thymeleaf.cache=true
